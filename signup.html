<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign Up</title>

    <!-- Google Fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="./images.jpeg">

</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <header>Sign Up</header>
        </div>

        <div class="input-box">
            <input type="email" class="input-field" placeholder="Your First Name" autocomplete="off" required>
        </div>

        <div class="input-box">
            <input type="email" class="input-field" placeholder="Last Name" autocomplete="off" required>
        </div>

        <div class="input-box">
            <input type="email" class="input-field" placeholder="Your Personal Email" autocomplete="off" required>
        </div>

        <div class="input-box">
            <input type="password" class="input-field" placeholder="Password" autocomplete="off" required>
        </div>

        <div class="input-box">
            <input type="password" class="input-field" placeholder="Confirm Password" autocomplete="off" required>
        </div>

        <div class="forgot">
            <section>
                <input type="checkbox" id="check-box">
                <label for="check-box">Remember me</label>
            </section>
        </div>

        <div class="input-submit">
            <button class="submit-btn" id="submit-btn">Sign Up</button>
        </div>


        <div class="sign-up-link">
            <p>Already have an account? <a href="./index.html">Sign In</a></p>
        </div>
    </div>
</body>
</html>
